<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Case Room — Consulting Interview Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-dark: #10141c;        /* war room background */
    --ink-dark-2: #171d29;      /* panel background on dark */
    --manila: #e7dcbd;          /* case folder */
    --manila-2: #efe6ce;        /* lighter folder card */
    --manila-line: #c9b98c;     /* folder rule lines */
    --paper-ink: #201a10;       /* text on manila */
    --cream-ink: #ece7db;       /* text on dark */
    --cream-ink-dim: #a7adbb;
    --stamp-red: #a83a2b;       /* rubber stamp ink */
    --stamp-red-dim: #7c2c20;
    --cleared-teal: #3f6f62;    /* cleared / success stamp */
    --cleared-teal-dim: #2c4f45;
    --amber-tab: #c98a2b;       /* folder tab accent */
    --line-hair: rgba(231,220,189,0.14);
    --line-hair-dark: rgba(16,20,28,0.12);
    --radius: 3px;
    --font-display: 'Space Mono', monospace;
    --font-body: 'Source Serif 4', Georgia, serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--ink-dark);
    background-image:
      radial-gradient(circle at 10% 0%, rgba(201,138,43,0.06), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(168,58,43,0.06), transparent 45%);
    color: var(--cream-ink);
    font-family: var(--font-body);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  a{color:inherit;}
  button{font-family: var(--font-mono); cursor:pointer;}
  ::selection{background: var(--amber-tab); color: var(--paper-ink);}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px clamp(16px,4vw,48px) 0;
    max-width: 1180px; margin: 0 auto;
  }
  .brand{
    display:flex; align-items:baseline; gap:10px;
  }
  .brand-mark{
    font-family: var(--font-display); font-weight:700; font-size:13px;
    letter-spacing:0.14em; color: var(--paper-ink);
    background: var(--amber-tab);
    padding: 4px 8px; border-radius: 2px;
    transform: rotate(-2deg);
    display:inline-block;
  }
  .brand-name{
    font-family: var(--font-display); font-size: 19px; font-weight:700;
    letter-spacing: 0.01em; color: var(--cream-ink);
  }
  .brand-sub{
    font-family: var(--font-mono); font-size:11px; letter-spacing:0.08em;
    color: #8b93a3; text-transform:uppercase;
  }
  .stat-pill{
    font-family: var(--font-mono); font-size:12px; color:#8b93a3;
    display:flex; gap:18px;
  }
  .stat-pill b{color:var(--cream-ink); font-weight:600;}

  /* ---------- Folder tab nav ---------- */
  .tabnav{
    max-width: 1180px; margin: 26px auto 0;
    padding: 0 clamp(16px,4vw,48px);
    display:flex; gap:6px; align-items:flex-end;
  }
  .tab-btn{
    font-family: var(--font-mono); font-size:12.5px; letter-spacing:0.04em;
    background: var(--ink-dark-2); color:#8b93a3;
    border: 1px solid var(--line-hair);
    border-bottom: none;
    padding: 10px 18px 12px;
    border-radius: 8px 8px 0 0;
    position:relative; top:1px;
    transition: color .15s ease, background .15s ease, transform .15s ease;
  }
  .tab-btn:hover{ color: var(--cream-ink); transform: translateY(-2px); }
  .tab-btn.active{
    background: var(--manila); color: var(--paper-ink);
    border-color: var(--manila);
    font-weight:600;
  }

  /* ---------- Folder body ---------- */
  .folder{
    max-width: 1180px; margin: 0 auto 80px;
    padding: clamp(20px,4vw,42px) clamp(16px,4vw,48px) 60px;
    background: var(--manila);
    background-image: linear-gradient(var(--manila-line) 1px, transparent 1px);
    background-size: 100% 34px;
    background-position: 0 4px;
    color: var(--paper-ink);
    border-radius: 0 8px 8px 8px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.55), 0 2px 0 var(--manila-line);
    min-height: 60vh;
    position:relative;
  }
  .folder::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:52px;
    background: repeating-linear-gradient(to bottom, transparent 0 22px, var(--manila-line) 22px 23px);
    opacity:.55;
    pointer-events:none;
  }
  .view{ display:none; animation: fadeIn .25s ease; }
  .view.active{ display:block; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .eyebrow{
    font-family: var(--font-mono); font-size:11px; letter-spacing:0.14em;
    text-transform:uppercase; color: var(--stamp-red);
    margin: 0 0 6px;
  }
  h1.page-title{
    font-family: var(--font-display); font-size: clamp(24px,3.4vw,34px);
    margin: 0 0 6px; font-weight:700; letter-spacing:-0.01em;
  }
  .page-desc{ margin:0 0 28px; max-width:640px; color:#3a2f1c; line-height:1.55; font-size:15px;}

  /* stamp graphic */
  .stamp{
    position:absolute; top:26px; right:34px;
    font-family: var(--font-display); font-weight:700; font-size:13px;
    letter-spacing:0.12em; color: var(--stamp-red);
    border: 3px solid var(--stamp-red);
    padding: 6px 12px; border-radius:4px;
    transform: rotate(6deg);
    opacity:.85;
    mix-blend-mode: multiply;
  }
  .stamp.cleared{ color: var(--cleared-teal); border-color: var(--cleared-teal); }

  /* ---------- generic card ---------- */
  .card{
    background: var(--manila-2);
    border: 1px solid var(--manila-line);
    border-radius: var(--radius);
    padding: 20px 22px;
  }
  .grid{ display:grid; gap:16px; }
  .grid-2{ grid-template-columns: repeat(2,1fr); }
  .grid-3{ grid-template-columns: repeat(3,1fr); }
  .grid-4{ grid-template-columns: repeat(4,1fr); }
  @media (max-width:820px){ .grid-2,.grid-3,.grid-4{ grid-template-columns: 1fr; } }

  label.field-label{
    display:block; font-family: var(--font-mono); font-size:11px;
    letter-spacing:0.08em; text-transform:uppercase; color:#5c4e2f;
    margin-bottom:6px;
  }
  select, textarea, input[type=text]{
    width:100%; font-family: var(--font-body); font-size:14.5px;
    background: #fbf8ef; border: 1px solid var(--manila-line);
    border-radius: 3px; padding: 10px 12px; color: var(--paper-ink);
    resize: vertical;
  }
  select{ font-family: var(--font-mono); font-size:13px; }
  textarea:focus, select:focus, input:focus{
    outline: 2px solid var(--amber-tab); outline-offset:1px;
  }

  .btn{
    font-family: var(--font-mono); font-size:12.5px; letter-spacing:0.05em;
    padding: 11px 20px; border-radius: 3px; border:none;
    display:inline-flex; align-items:center; gap:8px;
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .btn:active{ transform: translateY(1px); }
  .btn-primary{ background: var(--stamp-red); color:#fbf3ea; font-weight:600; }
  .btn-primary:hover{ background: var(--stamp-red-dim); }
  .btn-dark{ background: var(--ink-dark); color: var(--cream-ink); font-weight:600; }
  .btn-dark:hover{ background:#232b3a; }
  .btn-outline{ background:transparent; color: var(--paper-ink); border: 1px solid var(--paper-ink); }
  .btn-outline:hover{ background: rgba(16,20,28,0.06); }
  .btn-teal{ background: var(--cleared-teal); color:#f2f7f4; font-weight:600; }
  .btn-teal:hover{ background: var(--cleared-teal-dim); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }

  .badge{
    font-family: var(--font-mono); font-size:10.5px; letter-spacing:0.06em;
    text-transform:uppercase; padding:3px 8px; border-radius:2px;
    display:inline-block;
  }
  .badge-red{ background: rgba(168,58,43,0.14); color: var(--stamp-red); }
  .badge-teal{ background: rgba(63,111,98,0.16); color: var(--cleared-teal); }
  .badge-amber{ background: rgba(201,138,43,0.18); color:#8a5c15; }

  hr.rule{ border:none; border-top:1px solid var(--manila-line); margin: 24px 0; }

  /* loading */
  .loader{
    display:flex; align-items:center; gap:12px; font-family: var(--font-mono);
    font-size:13px; color:#5c4e2f; padding: 30px 0;
  }
  .loader .dot{
    width:8px; height:8px; border-radius:50%; background: var(--stamp-red);
    animation: pulse 1s infinite ease-in-out;
  }
  .loader .dot:nth-child(2){ animation-delay:.15s; }
  .loader .dot:nth-child(3){ animation-delay:.3s; }
  @keyframes pulse{ 0%,100%{opacity:.25; transform:scale(.8);} 50%{opacity:1; transform:scale(1.1);} }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:#374156; border-radius:6px; }

  /* Dashboard */
  .kpi{
    background: var(--manila-2); border:1px solid var(--manila-line); border-radius:var(--radius);
    padding:18px 20px;
  }
  .kpi .num{ font-family: var(--font-display); font-size:30px; font-weight:700; }
  .kpi .lbl{ font-family: var(--font-mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:#5c4e2f; margin-top:4px; }

  /* generator form */
  .chip-group{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    font-family: var(--font-mono); font-size:12px; padding:7px 13px;
    border:1px solid var(--manila-line); border-radius:20px; background:#fbf8ef;
    color:#5c4e2f;
  }
  .chip.selected{ background: var(--stamp-red); color:#fbf3ea; border-color: var(--stamp-red); }

  /* practice room */
  .case-header{
    background: var(--ink-dark); color: var(--cream-ink);
    border-radius: 6px; padding: 20px 24px; margin-bottom:20px;
    position:relative; overflow:hidden;
  }
  .case-header::after{
    content:""; position:absolute; right:-40px; top:-40px; width:160px; height:160px;
    background: radial-gradient(circle, rgba(201,138,43,0.18), transparent 70%);
  }
  .timer{
    font-family: var(--font-display); font-size:26px; font-weight:700;
    color: var(--amber-tab);
  }
  .step-tabs{ display:flex; gap:4px; flex-wrap:wrap; margin-bottom:16px; }
  .step-tab{
    font-family: var(--font-mono); font-size:11.5px; padding:8px 14px;
    border-radius:20px; border:1px solid var(--manila-line); background:transparent;
    color:#5c4e2f;
  }
  .step-tab.active{ background: var(--paper-ink); color: var(--manila); border-color: var(--paper-ink); }
  .step-tab.done::before{ content:"✓ "; color: var(--cleared-teal); }

  .exhibit{
    background:#fbf8ef; border:1px solid var(--manila-line); border-radius:3px;
    padding:14px 16px; margin-bottom:10px;
  }
  .exhibit table{ width:100%; border-collapse:collapse; font-family:var(--font-mono); font-size:12.5px; margin-top:8px;}
  .exhibit th, .exhibit td{ text-align:left; padding:6px 8px; border-bottom:1px solid var(--manila-line); }
  .exhibit th{ color:#5c4e2f; font-weight:600; }

  /* portfolio */
  .case-row{
    display:flex; justify-content:space-between; align-items:center; gap:16px;
    background: var(--manila-2); border:1px solid var(--manila-line); border-radius:3px;
    padding:14px 18px; margin-bottom:10px;
  }
  .case-row:hover{ border-color: var(--stamp-red); }
  .score-ring{
    width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:13px;
    border: 3px solid var(--cleared-teal); color: var(--cleared-teal); flex:none;
  }
  .score-ring.mid{ border-color: var(--amber-tab); color:#8a5c15; }
  .score-ring.low{ border-color: var(--stamp-red); color: var(--stamp-red); }

  .empty-state{
    text-align:center; padding: 60px 20px; color:#5c4e2f;
  }
  .empty-state .glyph{ font-size:38px; margin-bottom:10px; }

  footer.credit{
    max-width:1180px; margin:0 auto 40px; padding: 0 clamp(16px,4vw,48px);
    font-family: var(--font-mono); font-size:11px; color:#4a5061; text-align:center;
  }

  /* ---------- Mock interview chat ---------- */
  .chat-window{
    background:#fbf8ef; border:1px solid var(--manila-line); border-radius:4px;
    padding: 18px; height: 460px; overflow-y:auto; display:flex; flex-direction:column; gap:14px;
  }
  .chat-msg{ max-width:78%; display:flex; flex-direction:column; gap:4px; }
  .chat-msg.interviewer{ align-self:flex-start; }
  .chat-msg.candidate{ align-self:flex-end; align-items:flex-end; }
  .chat-role{
    font-family: var(--font-mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:#8a7a4e;
  }
  .chat-bubble{
    padding:10px 14px; border-radius:10px; font-size:13.5px; line-height:1.5; white-space:pre-wrap;
  }
  .chat-msg.interviewer .chat-bubble{ background: var(--ink-dark); color: var(--cream-ink); border-bottom-left-radius:2px; }
  .chat-msg.candidate .chat-bubble{ background: var(--stamp-red); color:#fbf3ea; border-bottom-right-radius:2px; }
  .chat-input-row{ display:flex; gap:10px; margin-top:12px; align-items:flex-end; }
  .chat-input-row textarea{ flex:1; }
  .typing-indicator{ font-family: var(--font-mono); font-size:11.5px; color:#8a7a4e; padding: 2px 4px; }

  /* ---------- Print / PDF export ---------- */
  #printPortfolio{ display:none; }
  @media print{
    body{ background:#fff !important; }
    .topbar, .tabnav, .folder, footer.credit{ display:none !important; }
    #printPortfolio{ display:block !important; background:#fff; color:#111; padding:0; max-width:100%; }
  }

  /* ---------- Application tracker ---------- */
  .tracker-card{
    background: var(--manila-2); border:1px solid var(--manila-line); border-radius: var(--radius);
    padding:16px 18px; margin-bottom:10px;
  }
  .tracker-top{ display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap; align-items:flex-start; }
  .tracker-meta{ font-family:var(--font-mono); font-size:11px; color:#5c4e2f; margin-top:4px; }
  .status-select{
    font-family:var(--font-mono); font-size:11.5px; padding:6px 8px; border-radius:3px;
    border:1px solid var(--manila-line); background:#fbf8ef;
  }
  .region-filter-bar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .status-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; }

  @media (max-width:700px){
    .grid-2,.grid-3,.grid-4{ grid-template-columns:1fr; }
    .stamp{ display:none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="brand-mark">CF-01</span>
    <div>
      <div class="brand-name">The Case Room</div>
      <div class="brand-sub">Consulting Interview Prep &amp; Portfolio</div>
    </div>
  </div>
  <div class="stat-pill" id="topStats">
    <span><b id="topCasesDone">0</b> cases logged</span>
    <span><b id="topStreak">0</b> day streak</span>
  </div>
</div>

<nav class="tabnav" id="tabNav">
  <button class="tab-btn active" data-view="dashboard">01 — Dashboard</button>
  <button class="tab-btn" data-view="generate">02 — Generate Case</button>

  <!-- ============ GENERATE ============ -->

  <!-- ============ PRACTICE ============ -->

  <!-- ============ PORTFOLIO ============ -->

<script>
/* =========================================================================
   THE CASE ROOM — app state
   ========================================================================= */
const STEP_ORDER = ['clarify','structure','exhibits','synthesis'];
const STEP_LABELS = {
  clarify: 'Clarify', structure: 'Structure', exhibits: 'Exhibits & Math', synthesis: 'Synthesis'
};

const state = {
  view: 'dashboard',
  currentCase: null,          // full case object returned by generator
  currentStep: 'clarify',
  showClarifyAnswers: false,
  work: { clarify: '', structure: '', exhibits: '', synthesis: '' },
  timerSeconds: 0,
  timerInterval: null,
  timerRunning: false,
  generating: false,
  genError: null,
  grading: false,
  gradeError: null,
  feedback: null,
  savedThisCase: false,
  portfolio: { cases: [], streak: 0, lastActiveDate: null },
  portfolioExpanded: null,
  genForm: { industry: 'Consumer Goods', caseType: 'Profitability', difficulty: 'MBA-level', focus: '' },
  libraryOpen: {},
  mock: {
    active: false, case: null, transcript: [], sending: false, ended: false,
    feedback: null, grading: false, gradeError: null, savedThisCase: false, genError: null, generating: false
  },
  mockForm: { industry: 'Consumer Goods', caseType: 'Profitability', difficulty: 'MBA-level', focus: '' },
  tracker: { regionFilter: 'All', tierFilter: 'All', search: '', tracked: {} }
};

const CASE_TYPES = ['Profitability', 'Market Entry', 'M&A / Due Diligence', 'Growth Strategy', 'Pricing Strategy', 'Operations & Cost', 'Market Sizing', 'New Product Launch'];
const DIFFICULTIES = ['Entry-level', 'MBA-level', 'Advanced / Partner-style'];
const INDUSTRIES = ['Consumer Goods', 'Technology', 'Healthcare & Pharma', 'Financial Services', 'Retail & E-commerce', 'Energy & Utilities', 'Private Equity', 'Nonprofit & Social Impact', 'Telecom', 'Manufacturing & Industrials', 'Airlines & Travel', 'Media & Entertainment'];

/* =========================================================================
   STORAGE HELPERS  (browser localStorage — per-device, no backend needed)
   ========================================================================= */
async function storGet(key){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function storSet(key, val){
  try{
    localStorage.setItem(key, JSON.stringify(val));
    return true;
  }catch(e){ console.error('storage set failed', e); return false; }
}
async function storDelete(key){
  try{ localStorage.removeItem(key); }catch(e){ /* ignore */ }
}

async function loadPortfolio(){
  const p = await storGet('portfolio');
  state.portfolio = p || { cases: [], streak: 0, lastActiveDate: null };
}
async function savePortfolio(){
  await storSet('portfolio', state.portfolio);
}
async function saveCaseDetail(id, detail){
  return await storSet('case-detail:' + id, detail);
}
async function loadCaseDetail(id){
  return await storGet('case-detail:' + id);
}

function todayStr(){
  return new Date().toISOString().slice(0,10);
}
function bumpStreak(){
  const today = todayStr();
  if (state.portfolio.lastActiveDate === today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yesterday = y.toISOString().slice(0,10);
  if (state.portfolio.lastActiveDate === yesterday){
    state.portfolio.streak = (state.portfolio.streak||0) + 1;
  } else {
    state.portfolio.streak = 1;
  }
  state.portfolio.lastActiveDate = today;
}

/* =========================================================================
   CLAUDE API HELPERS
   ========================================================================= */
function stripFences(text){
  return text.replace(/```json/gi,'').replace(/```/g,'').trim();
}

let sitePasscode = localStorage.getItem('site-passcode') || '';

async function claudeFetch(body){
  const doFetch = () => fetch('/api/claude', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-site-passcode': sitePasscode || '' },
    body: JSON.stringify(body)
  });
  let response = await doFetch();
  if (response.status === 401){
    const entered = window.prompt('This site is passcode-protected. Enter the access passcode:');
    if (entered){
      sitePasscode = entered;
      localStorage.setItem('site-passcode', entered);
      response = await doFetch();
    }
  }
  if (!response.ok){
    let detail = '';
    try{
      const errBody = await response.json();
      detail = errBody.error && errBody.error.message ? errBody.error.message
        : (typeof errBody.error === 'string' ? errBody.error : (errBody.detail || JSON.stringify(errBody)));
    }catch(e){ /* response wasn't JSON — leave detail blank */ }
    throw new Error('API request failed (' + response.status + ')' + (detail ? ': ' + detail : ''));
  }
  return await response.json();
}

async function callClaudeJSON(systemPrompt, userPrompt, maxTokens){
  const data = await claudeFetch({
    max_tokens: maxTokens || 1800,
    system: systemPrompt,
    messages: [ { role: 'user', content: userPrompt } ]
  });
  const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
  const cleaned = stripFences(textBlocks);
  return JSON.parse(cleaned);
}

async function generateCaseFromAPI(form){
  const sys = `You are a former MBB consulting interviewer writing realistic case interview prompts for students preparing to break into consulting. You always respond with ONLY valid JSON matching the exact schema requested — no preamble, no markdown fences, no commentary. Numbers in exhibits must be internally consistent and support a clear, calculable insight.`;
  const user = `Write one original case interview prompt with these parameters:
Industry: ${form.industry}
Case type: ${form.caseType}

async function callClaudeText(systemPrompt, messages, maxTokens){
  const data = await claudeFetch({
    max_tokens: maxTokens || 500,
    system: systemPrompt,
    messages: messages
  });
  return (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
}

function mockInterviewSystemPrompt(caseObj){
  return `You are a professional, personable case interviewer at a top consulting firm, conducting a LIVE case interview with a candidate who is preparing for consulting recruiting. Stay in character as the interviewer for the entire conversation.

This is the confidential case file only you can see:
Title: ${caseObj.title}
Client context: ${caseObj.clientContext}
Question: ${caseObj.question}
Clarifying Q&A the client has pre-approved: ${JSON.stringify(caseObj.clarifyingQA)}
Exhibits available (only share one when the candidate asks for data/exhibits relevant to it, and present it as a clean plain-text table): ${JSON.stringify(caseObj.exhibits)}
Ideal framework (do NOT reveal, use only to judge if candidate is on track): ${caseObj.idealFramework}
Key math and correct answer (do NOT reveal until candidate has attempted the math): ${caseObj.keyMath}
Model recommendation (do NOT reveal, ask the candidate to reach their own): ${caseObj.recommendation}

Rules:
- Keep every reply short and conversational, 2-5 sentences, like a real spoken interview — never lecture or dump the whole case file at once.
- Only answer clarifying questions that map to the pre-approved Q&A list; for anything else, give a brief reasonable answer consistent with the case.
- Only share exhibit data when the candidate specifically asks for data, numbers, or an exhibit — then paste the relevant table as plain text.
- Push the candidate to structure before diving into numbers. If they jump straight to math, gently redirect them to lay out a framework first.
- If the candidate is stuck for a while, offer one small nudge, not the answer.
- Near the end, prompt them for a final recommendation if they haven't given one ("What would you tell the CEO?").
- Never reveal the ideal framework, key math answer, or model recommendation directly — let the candidate arrive at their own conclusions.`;
}

async function getInterviewerReply(caseObj, transcript){
  const sys = mockInterviewSystemPrompt(caseObj);
  const messages = transcript.map(m => ({ role: m.role === 'interviewer' ? 'assistant' : 'user', content: m.content }));
  return await callClaudeText(sys, messages, 400);
}

async function gradeMockInterviewFromAPI(caseObj, transcript){
  const sys = `You are a rigorous, encouraging former MBB case interviewer grading a transcript of a live mock case interview. You always respond with ONLY valid JSON matching the exact schema requested — no preamble, no markdown fences, no commentary. Be specific and reference the candidate's actual words from the transcript. Be honest about weaknesses, not just encouraging.`;
  const transcriptText = transcript.map(m => `${m.role === 'interviewer' ? 'INTERVIEWER' : 'CANDIDATE'}: ${m.content}`).join('\n\n');
  const user = `CASE FILE:
Title: ${caseObj.title}
Client context: ${caseObj.clientContext}
Question: ${caseObj.question}
Ideal framework (reference, not shown to candidate): ${caseObj.idealFramework}
Key math (reference): ${caseObj.keyMath}
Model recommendation (reference): ${caseObj.recommendation}

FULL INTERVIEW TRANSCRIPT:
${transcriptText}

Grade the candidate's performance across this transcript. Respond with ONLY this JSON object:
{
  "overallScore": <integer 1-10>,
  "structureScore": <integer 1-10, MECE-ness and completeness of framework as it emerged in the conversation>,
  "mathScore": <integer 1-10, correctness and clarity of any quantitative work in the conversation>,
  "synthesisScore": <integer 1-10, answer-first communication and business judgment in the final recommendation>,
  "strengths": [ "specific strength referencing something the candidate actually said" ],  // 3-4 items
  "improvements": [ "specific, actionable improvement" ],  // 3-4 items
  "modelComparison": "3-4 sentences comparing the candidate's approach in the conversation to the ideal framework, noting what matched and what they missed",
  "summary": "2-3 sentence overall verdict, direct and specific, written to the candidate as 'you'"
}`;
  return await callClaudeJSON(sys, user, 1600);
}

function fmtTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
}
function avgScore(){
  const cs = state.portfolio.cases;
  if (!cs.length) return 0;
  return Math.round((cs.reduce((a,c)=>a+c.overallScore,0)/cs.length)*10)/10;
}
function totalTime(){
  return state.portfolio.cases.reduce((a,c)=>a+(c.timeSpentSec||0),0);
}
function scoreClass(n){
  if (n >= 8) return '';
  if (n >= 5) return 'mid';
  return 'low';
}

function escapeHtml(str){
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function setGenField(key, val){
  state.genForm[key] = val;

async function doGenerate(){
  state.generating = true;
  state.genError = null;
  renderGenerate();
  try{
    const caseObj = await generateCaseFromAPI(state.genForm);
    caseObj.id = 'case_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    caseObj.dateCreated = new Date().toISOString();
    state.currentCase = caseObj;
    state.currentStep = 'clarify';
    state.showClarifyAnswers = false;
    state.work = { clarify:'', structure:'', exhibits:'', synthesis:'' };
    state.feedback = null;
    state.gradeError = null;
    state.savedThisCase = false;
    state.timerSeconds = 0;
    stopTimer();
    startTimer();
    state.generating = false;
    switchView('practice');
  }catch(e){
    console.error(e);
    state.generating = false;
    state.genError = (e && e.message) ? e.message : 'unknown error';
    renderGenerate();
  }
}

function startTimer(){
  if (state.timerInterval) return;
  state.timerRunning = true;
  state.timerInterval = setInterval(() => {
    state.timerSeconds++;
    document.querySelectorAll('.timerNum').forEach(elx => elx.textContent = fmtTime(state.timerSeconds));
  }, 1000);
}
function stopTimer(){
  state.timerRunning = false;
  if (state.timerInterval){ clearInterval(state.timerInterval); state.timerInterval = null; }
}
function toggleTimer(){
  if (state.timerRunning) stopTimer(); else startTimer();
  if (state.view === 'mockinterview') renderMockInterview(); else renderPractice();
}

          <div style="font-family:var(--font-display);font-size:20px;font-weight:700;">${escapeHtml(c.title)}</div>
        </div>
        <div style="text-align:right;">
          <div class="timer timerNum" id="timerDisplay">${fmtTime(state.timerSeconds)}</div>
          <button class="btn btn-outline" style="margin-top:6px;border-color:var(--cream-ink);color:var(--cream-ink);padding:5px 12px;font-size:11px;" onclick="toggleTimer()">${state.timerRunning ? 'Pause' : 'Resume'}</button>
        </div>
      </div>
    </div>

    ${!state.feedback ? `
      <div class="step-tabs">${stepTabsHtml}</div>
      <div class="card" style="margin-bottom:16px;">${stepBody}</div>
      <div style="display:flex;justify-content:space-between;">
        <button class="btn btn-outline" ${stepIdx===0?'disabled':''} onclick="prevStep()">← Back</button>
        ${isLast
          ? `<button class="btn btn-primary" onclick="doGrade()">Submit for feedback →</button>`
          : `<button class="btn btn-dark" onclick="nextStep()">Next: ${STEP_LABELS[STEP_ORDER[stepIdx+1]]} →</button>`}
      </div>
    ` : ''}

    ${feedbackHtml}
  `;
}

function setStep(s){ state.currentStep = s; renderPractice(); }
function nextStep(){ const i = STEP_ORDER.indexOf(state.currentStep); if (i < STEP_ORDER.length-1){ state.currentStep = STEP_ORDER[i+1]; renderPractice(); } }
function prevStep(){ const i = STEP_ORDER.indexOf(state.currentStep); if (i > 0){ state.currentStep = STEP_ORDER[i-1]; renderPractice(); } }
function revealClarify(){ state.showClarifyAnswers = true; renderPractice(); }

async function doGrade(){
  stopTimer();
  state.grading = true;
  state.gradeError = null;
  renderPractice();
  try{
    const fb = await gradeSubmissionFromAPI(state.currentCase, state.work);
    state.feedback = fb;
    state.grading = false;
    renderPractice();
  }catch(e){
    console.error(e);
    state.grading = false;
    state.gradeError = (e && e.message) ? e.message : 'unknown error';
    renderPractice();
  }
}

async function doSaveToPortfolio(){
  const c = state.currentCase;
  const fb = state.feedback;
  const summary = {
    id: c.id, title: c.title, industry: c.industry, caseType: c.caseType, difficulty: c.difficulty,
    overallScore: fb.overallScore, dateCompleted: new Date().toISOString(), timeSpentSec: state.timerSeconds
  };
  const detail = { case: c, work: state.work, feedback: fb, timeSpentSec: state.timerSeconds, dateCompleted: summary.dateCompleted };
  await saveCaseDetail(c.id, detail);
  state.portfolio.cases.push(summary);
  bumpStreak();
  await savePortfolio();
  state.savedThisCase = true;
  renderPractice();
  renderTopStats();
}

function discardCase(){
  state.currentCase = null;
  state.feedback = null;
  stopTimer();
  switchView('generate');
}

/* =========================================================================
   RENDER: MOCK INTERVIEW (live chat)
   ========================================================================= */
function setMockField(key, val){
  state.mockForm[key] = val;
  renderMockInterview();
}

async function startMockInterview(){
  state.mock.generating = true;
  state.mock.genError = null;
  renderMockInterview();
  try{
    const caseObj = await generateCaseFromAPI(state.mockForm);
    caseObj.id = 'mock_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    caseObj.dateCreated = new Date().toISOString();
    state.mock.case = caseObj;
    state.mock.active = true;
    state.mock.ended = false;
    state.mock.feedback = null;
    state.mock.gradeError = null;
    state.mock.savedThisCase = false;
    state.mock.transcript = [
      { role: 'interviewer', content: `${caseObj.clientContext}\n\n${caseObj.question}` }
    ];
    state.mock.generating = false;
    state.timerSeconds = 0;
    stopTimer();
    startTimer();
    renderMockInterview();
  }catch(e){
    console.error(e);
    state.mock.generating = false;
    state.mock.genError = (e && e.message) ? e.message : 'unknown error';
    renderMockInterview();
  }
}

async function sendMockMessage(){
  const box = document.getElementById('mockInput');
  if (!box) return;
  const text = box.value.trim();
  if (!text || state.mock.sending) return;
  state.mock.transcript.push({ role:'candidate', content: text });
  box.value = '';
  state.mock.sending = true;
  renderMockInterview();
  try{
    const reply = await getInterviewerReply(state.mock.case, state.mock.transcript);
    state.mock.transcript.push({ role:'interviewer', content: reply });
    state.mock.sending = false;
    renderMockInterview();
  }catch(e){
    console.error(e);
    state.mock.transcript.push({ role:'interviewer', content: "(connection hiccup — the interviewer didn't catch that. Try sending again.)" });
    state.mock.sending = false;
    renderMockInterview();
  }
}
function handleMockKeydown(e){
  if (e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMockMessage();
  }
}

async function endMockInterview(){
  stopTimer();
  state.mock.grading = true;
  state.mock.gradeError = null;
  renderMockInterview();
  try{
    const fb = await gradeMockInterviewFromAPI(state.mock.case, state.mock.transcript);
    state.mock.feedback = fb;
    state.mock.grading = false;
    renderMockInterview();
  }catch(e){
    console.error(e);
    state.mock.grading = false;
    state.mock.gradeError = (e && e.message) ? e.message : 'unknown error';
    renderMockInterview();
  }
}

async function saveMockToPortfolio(){
  const c = state.mock.case;
  const fb = state.mock.feedback;
  const summary = {
    id: c.id, title: c.title + ' (Live Interview)', industry: c.industry, caseType: c.caseType, difficulty: c.difficulty,
    overallScore: fb.overallScore, dateCompleted: new Date().toISOString(), timeSpentSec: state.timerSeconds, isMock: true
  };
  const detail = { case: c, transcript: state.mock.transcript, feedback: fb, timeSpentSec: state.timerSeconds, dateCompleted: summary.dateCompleted, isMock: true };
  await saveCaseDetail(c.id, detail);
  state.portfolio.cases.push(summary);
  bumpStreak();
  await savePortfolio();
  state.mock.savedThisCase = true;
  renderMockInterview();
  renderTopStats();
}

function discardMock(){
  state.mock = { active:false, case:null, transcript:[], sending:false, ended:false, feedback:null, grading:false, gradeError:null, savedThisCase:false, genError:null, generating:false };
  stopTimer();
  renderMockInterview();
}

let portfolioDetailCache = {};

  if (!cases.length){
    el.innerHTML = `

        <button class="btn btn-primary" onclick="switchView('generate')">Draft your first case →</button>
      </div>`;
    return;
  }

              </div>
              <div class="card">
                <div style="font-family:var(--font-mono);font-size:11px;text-transform:uppercase;color:var(--stamp-red);margin-bottom:6px;">To improve</div>
                <ul style="margin:0;padding-left:16px;font-size:13px;">${d.feedback.improvements.map(s=>`<li>${escapeHtml(s)}</li>`).join('')}</ul>

            </div>

    <div style="margin-bottom:20px;">
      <button class="btn btn-dark" onclick="copyPortfolioSummary()">Copy portfolio summary</button>
      <button class="btn btn-primary" style="margin-left:10px;" onclick="exportPortfolioPDF()">Export to PDF</button>
      <span id="copyConfirm" style="font-family:var(--font-mono);font-size:11.5px;color:var(--cleared-teal);margin-left:10px;"></span>

}

function toggleExpand(id){
  state.portfolioExpanded = state.portfolioExpanded === id ? null : id;
  renderPortfolio();
}

async function removeCase(id){
  if (!confirm("Remove this case from your portfolio? This can't be undone.")) return;
  state.portfolio.cases = state.portfolio.cases.filter(c => c.id !== id);
  await savePortfolio();
  await storDelete('case-detail:' + id);
  delete portfolioDetailCache[id];
  state.portfolioExpanded = null;
  renderPortfolio();
  renderTopStats();
}

function copyPortfolioSummary(){
  const cases = state.portfolio.cases.slice().sort((a,b)=> new Date(b.dateCompleted) - new Date(a.dateCompleted));
  const lines = [
    'CASE INTERVIEW PREP LOG', '========================', '',
    `Cases completed: ${cases.length}    Avg score: ${avgScore()}/10    Total practice time: ${fmtTime(totalTime())}`, ''
  ];
  cases.forEach(c => {
    lines.push(`• ${c.title} — ${c.industry} / ${c.caseType} (${c.difficulty}) — Score ${c.overallScore}/10 — ${fmtDate(c.dateCompleted)}`);
  });
  const text = lines.join('\n');
  navigator.clipboard.writeText(text).then(() => {
    const conf = document.getElementById('copyConfirm');
    if (conf){ conf.textContent = 'Copied ✓'; setTimeout(()=>{ if(conf) conf.textContent=''; }, 2500); }
  }).catch(() => {
    const conf = document.getElementById('copyConfirm');
    if (conf) conf.textContent = 'Could not copy — select and copy manually.';
  });
}

/* =========================================================================
   RENDER: FRAMEWORK LIBRARY (static reference content)
   ========================================================================= */
const LIBRARY = [
  { id:'general', title:'General Case Approach', body:`Open by restating the question in your own words and asking clarifying questions on scope, client goals, timeline, and definitions. Structure your framework out loud before diving into any branch. Stay hypothesis-driven — state what you expect to find and why. Do math out loud, sanity-check your numbers, and round sensibly. Always synthesize answer-first: lead with your recommendation, then give 2-3 supporting reasons and a risk or next step.` },
  { id:'profitability', title:'Profitability Framework', body:`Profit = Revenue − Costs. Revenue = Price × Volume (break volume into customers × frequency, or units sold across segments/channels). Costs split into Fixed and Variable, and further into categories like COGS, labor, marketing, overhead. Ask when the profit decline started and whether it's revenue-driven, cost-driven, or both, then quantify each branch before recommending.` },
  { id:'market-entry', title:'Market Entry Framework', body:`Cover: (1) Market attractiveness — size, growth, profitability, regulation; (2) Competitive landscape — key players, market share, barriers to entry; (3) Capability fit — does the client have the assets, brand, or channels to win; (4) Entry mode — organic build, acquisition, partnership/JV, licensing; (5) Financials — investment required, expected returns, payback period.` },
  { id:'ma', title:'M&A / Due Diligence Framework', body:`Evaluate: (1) Strategic rationale — why this deal, what capability or market gap it fills; (2) Standalone value of the target — market position, financials, growth trajectory; (3) Synergies — revenue synergies (cross-sell, new channels) and cost synergies (overhead, procurement, footprint); (4) Risks — integration, cultural fit, regulatory, customer/talent retention; (5) Valuation — is the price justified relative to standalone value plus synergies.` },
  { id:'growth', title:'Growth Strategy Framework', body:`Use an Ansoff-style lens: (1) Market penetration — sell more of the current product to current customers; (2) Product development — new products for current customers; (3) Market development — current products into new geographies/segments; (4) Diversification — new products for new markets. For each lever, size the opportunity and assess feasibility and risk.` },
  { id:'pricing', title:'Pricing Strategy Framework', body:`Anchor on three lenses: (1) Cost-based — cost per unit plus target margin; (2) Value-based — willingness to pay, perceived value versus substitutes; (3) Competition-based — where competitors are priced and how the client should position relative to them. Consider price elasticity, segmentation (different prices for different segments), and second-order effects like channel conflict or cannibalization.` },
  { id:'ops', title:'Operations & Cost Reduction Framework', body:`Map the value chain end to end (procurement → production → logistics → distribution → after-sales) and identify where cost or inefficiency sits. Split costs into fixed vs. variable and controllable vs. uncontrollable. Consider levers: process efficiency, automation, footprint consolidation, supplier renegotiation, outsourcing, and headcount — then weigh impact against feasibility and risk to quality/service.` },
  { id:'sizing', title:'Market Sizing / Guesstimates', body:`Pick a clear approach — top-down (start from total population/market and narrow with filters) or bottom-up (build up from a unit of demand, e.g. per-store or per-customer spend). State every assumption out loud, use round numbers, and sanity-check the final answer against a number you already know (population, GDP, category size) before locking it in.` },
  { id:'tips', title:'Interview-Day Tips', body:`Think out loud — silence reads as stuck, not thoughtful. Take a moment to structure before speaking; interviewers reward a clear pause over a rushed ramble. Write numbers big and legible if using a whiteboard or paper. When you get an exhibit, state what you're looking for before reading every number. Always close with a confident, structured recommendation — never trail off.` }
];

function renderLibrary(){
  const el = document.getElementById('view-library');
  el.innerHTML = `
    <div class="eyebrow">Case File — Reference</div>
    <h1 class="page-title">Framework Library</h1>
    <p class="page-desc">Quick-reference frameworks to review before a drill, or to sanity-check your structure against after a case.</p>
    ${LIBRARY.map(item => `
      <div class="card" style="margin-bottom:10px;cursor:pointer;" onclick="toggleLibrary('${item.id}')">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="font-weight:600;font-size:14.5px;">${escapeHtml(item.title)}</div>
          <span style="font-family:var(--font-mono);font-size:13px;">${state.libraryOpen[item.id] ? '−' : '+'}</span>
        </div>
        ${state.libraryOpen[item.id] ? `<p style="font-size:13.5px;margin:12px 0 2px;line-height:1.6;">${escapeHtml(item.body)}</p>` : ''}
      </div>
    `).join('')}
  `;
}
function toggleLibrary(id){
  state.libraryOpen[id] = !state.libraryOpen[id];
  renderLibrary();
}

  renderTracker();
}

async function setTrackedStatus(id, status){
  if (!state.tracker.tracked[id]) state.tracker.tracked[id] = { status, notes:'', dateAdded: new Date().toISOString() };
  else state.tracker.tracked[id].status = status;
  state.tracker.tracked[id].updatedAt = new Date().toISOString();
  await saveTrackerData();
  renderTracker();
}
async function untrackCompany(id){
  delete state.tracker.tracked[id];
  await saveTrackerData();
  renderTracker();
}
async function updateTrackedNotes(id, notes){
  if (state.tracker.tracked[id]) state.tracker.tracked[id].notes = notes;
  await saveTrackerData();
}

function renderTracker(){
  const el = document.getElementById('view-tracker');
  const tr = state.tracker;

  const trackedIds = Object.keys(tr.tracked);
  const statusCounts = {};
  APP_STATUSES.forEach(s => statusCounts[s] = 0);
  trackedIds.forEach(id => { const s = tr.tracked[id].status; if (statusCounts[s] !== undefined) statusCounts[s]++; });

  const filtered = COMPANIES.filter(c => {
    if (tr.regionFilter !== 'All' && c.region !== tr.regionFilter) return false;
    if (tr.tierFilter !== 'All' && c.tier !== tr.tierFilter) return false;
    if (tr.search && !(c.company.toLowerCase().includes(tr.search.toLowerCase()))) return false;
    return true;
  });

  const regionChips = REGIONS.map(r => `<button class="chip ${tr.regionFilter===r?'selected':''}" onclick="setTrackerFilter('regionFilter','${r}')">${r}</button>`).join('');
  const tierChips = TIERS.map(t => `<button class="chip ${tr.tierFilter===t?'selected':''}" onclick="setTrackerFilter('tierFilter','${t.replace(/'/g,"\\'")}')">${t}</button>`).join('');

  const cards = filtered.map(c => {
    const tracked = tr.tracked[c.id];
    const statusOptions = APP_STATUSES.map(s => `<option value="${s}" ${tracked && tracked.status===s ? 'selected':''}>${s}</option>`).join('');
    return `
      <div class="tracker-card">
        <div class="tracker-top">
          <div>
            <div style="font-weight:700;font-size:15px;">${escapeHtml(c.company)}</div>
            <div class="tracker-meta">${escapeHtml(c.region)} · ${escapeHtml(c.tier)} · ${escapeHtml(c.scheme)}</div>
          </div>
          <a href="${c.url}" target="_blank" rel="noopener" class="btn btn-outline" style="padding:6px 12px;font-size:11px;text-decoration:none;">Careers page ↗</a>
        </div>
        <div style="font-size:13px;margin:10px 0 4px;"><b>Typical opening window:</b> ${escapeHtml(c.window)}</div>
        <div style="font-size:12.5px;color:#5c4e2f;margin-bottom:10px;">${escapeHtml(c.notes)}</div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <select class="status-select" onchange="setTrackedStatus('${c.id}', this.value)">
            <option value="" ${!tracked?'selected':''} disabled>Track this programme…</option>
            ${statusOptions}
          </select>
          ${tracked ? `<button class="btn btn-outline" style="padding:5px 10px;font-size:11px;" onclick="untrackCompany('${c.id}')">Remove</button>` : ''}
        </div>
        ${tracked ? `<textarea placeholder="Notes — contacts, referral, prep tasks…" rows="2" style="margin-top:8px;font-size:12.5px;" oninput="updateTrackedNotes('${c.id}', this.value)">${escapeHtml(tracked.notes||'')}</textarea>` : ''}
      </div>`;
  }).join('');

  el.innerHTML = `
    <div class="eyebrow">Case File — Applications</div>
    <h1 class="page-title">Application Tracker</h1>
    <p class="page-desc">Every major consulting employer across the UK, US, and Middle East offering graduate roles or internships — with typical application-opening patterns so you can plan ahead, plus a tracker for your own pipeline.</p>

    <div class="card" style="margin-bottom:20px;border-color:var(--stamp-red);">
      <div style="font-family:var(--font-mono);font-size:11px;text-transform:uppercase;color:var(--stamp-red);margin-bottom:4px;">Before you plan around these dates</div>
      <p style="font-size:12.5px;margin:0;">Opening windows below are typical seasonal patterns from recent recruiting cycles, not confirmed dates for the current year — firms shift their exact deadlines annually and many review on a rolling basis, so slots can fill before the stated deadline. Always confirm the current date on the official careers page linked on each card before you plan around it.</p>
    </div>

    <div class="grid grid-4" style="margin-bottom:24px;">
      <div class="kpi"><div class="num">${trackedIds.length}</div><div class="lbl">Tracked programmes</div></div>
      <div class="kpi"><div class="num">${statusCounts['Applied']+statusCounts['Online Assessment']+statusCounts['Case Interview / First Round']+statusCounts['Final Round']}</div><div class="lbl">In progress</div></div>
      <div class="kpi"><div class="num">${statusCounts['Offer']}</div><div class="lbl">Offers</div></div>
      <div class="kpi"><div class="num">${statusCounts['Researching']}</div><div class="lbl">Researching</div></div>
    </div>

    <div class="card" style="margin-bottom:22px;">
      <label class="field-label">Search by company</label>
      <input type="text" placeholder="e.g. McKinsey, Oliver Wyman…" value="${escapeHtml(tr.search)}" oninput="setTrackerFilter('search', this.value)" style="margin-bottom:14px;" />
      <label class="field-label">Region</label>
      <div class="region-filter-bar">${regionChips}</div>
      <label class="field-label">Firm type</label>
      <div class="region-filter-bar" style="margin-bottom:0;">${tierChips}</div>
    </div>

    ${cards || '<div class="empty-state card">No programmes match those filters.</div>'}
  `;
}

/* =========================================================================
   NAV / VIEW SWITCHING
   ========================================================================= */
function switchView(view){
  state.view = view;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  if (view === 'dashboard') renderDashboard();
  if (view === 'generate') renderGenerate();
  if (view === 'practice') renderPractice();
  if (view === 'portfolio') renderPortfolio();
  if (view === 'mockinterview') renderMockInterview();
  if (view === 'tracker') renderTracker();
  if (view === 'library') renderLibrary();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function renderTopStats(){
  document.getElementById('topCasesDone').textContent = state.portfolio.cases.length;
  document.getElementById('topStreak').textContent = state.portfolio.streak || 0;
}

document.getElementById('tabNav').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if (btn) switchView(btn.dataset.view);
});

/* =========================================================================
   INIT
   ========================================================================= */
async function init(){
  await loadPortfolio();
  await loadTrackerData();
  renderTopStats();
  renderDashboard();
  renderGenerate();
  renderPractice();
  renderPortfolio();
  renderMockInterview();
  renderTracker();
  renderLibrary();
}
init();
</script>
</body>
</html>
